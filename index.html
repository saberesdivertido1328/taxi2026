<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprende palabras en inglés</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --primary: #2f6fed;
      --primary-dark: #1f4fb0;
      --text: #1f2937;
      --muted: #6b7280;
      --ok: #117a3d;
      --bad: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .app {
      width: min(820px, 100%);
      background: var(--card);
      border-radius: 1rem;
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.12);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, var(--primary), #6ea0ff);
      color: white;
      padding: 1rem 1.25rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    header p {
      margin: .4rem 0 0;
      opacity: .95;
      font-size: .95rem;
    }

    .content {
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: .9rem;
      padding: 1rem;
    }

    .word {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin: 0;
    }

    .translation {
      margin: .5rem 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      min-height: 1.4em;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      margin-top: 1rem;
    }

    button {
      border: 0;
      background: var(--primary);
      color: white;
      padding: .65rem .9rem;
      border-radius: .6rem;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: var(--primary-dark); }

    button.secondary {
      background: #374151;
    }

    .quiz {
      display: grid;
      gap: .6rem;
    }

    input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: .6rem;
      padding: .7rem .8rem;
      font-size: 1rem;
    }

    .feedback {
      min-height: 1.2rem;
      font-weight: 700;
    }

    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }

    .stats {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 600;
    }

    .tip {
      font-size: .92rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>App para aprender palabras en inglés</h1>
      <p>Repasa tarjetas y luego escribe la traducción correcta.</p>
    </header>

    <section class="content">
      <article class="card">
        <h2 class="word" id="englishWord">house</h2>
        <p class="translation" id="spanishWord">&nbsp;</p>

        <div class="actions">
          <button id="showBtn">Mostrar traducción</button>
          <button id="nextBtn" class="secondary">Siguiente palabra</button>
        </div>
      </article>

      <article class="card quiz">
        <label for="answerInput"><strong>Quiz:</strong> escribe en español la palabra en inglés de arriba.</label>
        <input id="answerInput" type="text" placeholder="Escribe tu respuesta..." autocomplete="off" />
        <div class="actions">
          <button id="checkBtn">Comprobar</button>
          <button id="newQuizBtn" class="secondary">Nueva ronda</button>
        </div>
        <p id="feedback" class="feedback"></p>
      </article>

      <footer class="stats">
        <span>Aciertos: <strong id="correctCount">0</strong></span>
        <span>Intentos: <strong id="attemptCount">0</strong></span>
      </footer>
      <p class="tip">Tip: también puedes presionar <strong>Enter</strong> para comprobar tu respuesta.</p>
    </section>
  </main>

  <script>
    const words = [
      { en: 'house', es: 'casa' },
      { en: 'book', es: 'libro' },
      { en: 'water', es: 'agua' },
      { en: 'apple', es: 'manzana' },
      { en: 'friend', es: 'amigo' },
      { en: 'school', es: 'escuela' },
      { en: 'city', es: 'ciudad' },
      { en: 'window', es: 'ventana' },
      { en: 'car', es: 'coche' },
      { en: 'family', es: 'familia' }
    ];

    let currentIndex = 0;
    let correct = 0;
    let attempts = 0;

    const englishWord = document.getElementById('englishWord');
    const spanishWord = document.getElementById('spanishWord');
    const answerInput = document.getElementById('answerInput');
    const feedback = document.getElementById('feedback');
    const correctCount = document.getElementById('correctCount');
    const attemptCount = document.getElementById('attemptCount');

    function normalize(value) {
      return value
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function showWord() {
      englishWord.textContent = words[currentIndex].en;
      spanishWord.innerHTML = '&nbsp;';
      feedback.textContent = '';
      feedback.className = 'feedback';
      answerInput.value = '';
      answerInput.focus();
    }

    function nextWord() {
      currentIndex = Math.floor(Math.random() * words.length);
      showWord();
    }

    document.getElementById('showBtn').addEventListener('click', () => {
      spanishWord.textContent = words[currentIndex].es;
    });

    document.getElementById('nextBtn').addEventListener('click', nextWord);
    document.getElementById('newQuizBtn').addEventListener('click', nextWord);

    function checkAnswer() {
      const expected = normalize(words[currentIndex].es);
      const userAnswer = normalize(answerInput.value);

      if (!userAnswer) {
        feedback.textContent = 'Escribe una respuesta primero.';
        feedback.className = 'feedback bad';
        return;
      }

      attempts += 1;
      if (userAnswer === expected) {
        correct += 1;
        feedback.textContent = '¡Correcto! 🎉';
        feedback.className = 'feedback ok';
      } else {
        feedback.textContent = `No exactamente. Respuesta: ${words[currentIndex].es}`;
        feedback.className = 'feedback bad';
      }

      correctCount.textContent = correct;
      attemptCount.textContent = attempts;
    }

    document.getElementById('checkBtn').addEventListener('click', checkAnswer);
    answerInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        checkAnswer();
      }
    });

    showWord();
  </script>
</body>
</html>
